name: Publish to PyPI

# Trusted Publisher (OIDC, no stored secrets) + PEP 740 attestations.
# Fires on a signed v* tag (the existing release flow). The publish job runs in
# the `release` environment, which should carry a required-reviewer founder gate
# so a tag alone cannot push to PyPI without an explicit approval.
#
# PyPI setup (once, before the first real release): register a Trusted Publisher
# (or a pending publisher for a not-yet-existing project) matching exactly —
#   repository:  presidio-v/presidio-hardened-ikigov-assess
#   workflow:    publish.yml
#   environment: release
# See pypi-reserve/README.md for the full reservation + launch runbook.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC token for GitHub build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --require-hashes -r .github/constraints/release-build.txt
          # --no-isolation: build with the hash-pinned hatchling installed above
          # rather than letting `build` fetch an unpinned backend into a fresh env.
          python -m build --no-isolation
      - name: Check metadata
        run: |
          python -m pip install --require-hashes -r .github/constraints/twine.txt
          twine check dist/*
      # Attest and hand off dist/ before anything resolves unpinned packages: the
      # SBOM job installs the wheel's runtime deps, and code in one of those must
      # not be able to rewrite what gets attested and published.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  sbom:
    name: Generate SBOM
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC token for GitHub build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Generate SBOM
        run: |
          python -m pip install --require-hashes -r .github/constraints/cyclonedx.txt
          # Describe what a user installs: the wheel and its runtime closure in a
          # clean venv, not the build or SBOM tooling.
          python -m venv /tmp/runtime
          /tmp/runtime/bin/pip install dist/*.whl
          cyclonedx-py environment /tmp/runtime/bin/python --output-format JSON --output-file sbom.cdx.json
      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Published as a release asset (below), so it carries the same
          # build-provenance guarantee as the wheel and sdist.
          subject-path: sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing + sigstore
      attestations: write # PEP 740 provenance attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  registry:
    name: Publish to MCP Registry
    needs: publish # the registry verifies the PyPI package, so it must exist first
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml

  release-assets:
    name: Attach release assets
    needs: [build, sbom, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: .
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* sbom.cdx.json --repo "$GH_REPO" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* sbom.cdx.json \
              --repo "$GH_REPO" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "Release $GITHUB_REF_NAME"
          fi
