name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least privilege: read-only token (OpenSSF Scorecard Token-Permissions).
permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # Hash-pinned build toolchain (OpenSSF Scorecard Pinned-Dependencies):
          # pip/setuptools/wheel come from a --require-hashes lockfile so a
          # compromised index cannot substitute a build backend. This also keeps
          # the toolchain off known-vulnerable setuptools/wheel (CVE-2024-6345,
          # PYSEC-2025-49, CVE-2026-24049). Regenerate: see .github/constraints/.
          python -m pip install --require-hashes -r .github/constraints/ci-toolchain.txt
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff format --check .
          ruff check .

      - name: Run tests with coverage
        run: |
          pytest --cov=src/presidio_ikigov_assess --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          file: ./coverage.xml
        continue-on-error: true
